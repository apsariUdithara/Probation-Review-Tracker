<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 761" width="1100" height="761" role="img" aria-labelledby="title desc">
<title id="title">Scenario: add an employee</title>
<desc id="desc">Sequence diagram. The client sends POST /employees with name, joinDate and probationMonths. The route validates the body with createEmployeeBody, then calls createEmployee. The service opens a transaction, inserts the employee with initial and total months equal to probationMonths, and Postgres returns the row with the generated probation_end_date. It then inserts an employee.created audit event and commits. The route responds 201 Created with a Location header.</desc>
