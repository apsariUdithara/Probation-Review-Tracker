<text x="24" y="679" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6480" text-anchor="start">Step 2 is strict Zod: a real calendar date (isValidIsoDate), months 1–6, trimmed name; an extra companyId field → 400. It fails before BEGIN, so nothing is written.</text>
<text x="24" y="698" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6480" text-anchor="start">If step 5 or 6 throws, withTransaction (src/db.ts) rolls back: there is never an employee without its audit row.</text>
