<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 808" width="1180" height="808" role="img" aria-labelledby="title desc">
<title id="title">Scenario: an extension that would go over 6 months</title>
<desc id="desc">Sequence diagram for the over-the-limit case. The employee has a total of 6 months. The client requests a 1-month extension; validation passes and extendProbation begins a transaction and locks the row. assertCanExtend(6, 1) fails because 7 is more than 6 and throws BusinessRuleError before any write. withTransaction rolls back, the rejected promise reaches errorHandler, and the client receives 422 MAX_PROBATION_EXCEEDED. The total, end date, extensions and audit log are unchanged.</desc>
