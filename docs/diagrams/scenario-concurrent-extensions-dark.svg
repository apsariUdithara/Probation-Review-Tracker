<circle cx="782" cy="634" r="9" fill="#f0a34a"/>
<text x="782" y="638" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f1320" text-anchor="middle">9</text>
<path d="M 795 682 L 577 682" fill="none" stroke="#f0a34a" stroke-width="1.6" marker-end="url(#arrow-rejected)"/>
<text x="685" y="674" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#f0a34a" text-anchor="middle">ROLLBACK: nothing written</text>
<circle cx="818" cy="682" r="9" fill="#f0a34a"/>
<text x="818" y="686" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f1320" text-anchor="middle">10</text>
<path d="M 805 719 L 1023 719" fill="none" stroke="#f0a34a" stroke-width="1.6" marker-end="url(#arrow-rejected)"/>
<text x="915" y="711" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#f0a34a" text-anchor="middle">422 MAX_PROBATION_EXCEEDED</text>
<circle cx="782" cy="719" r="9" fill="#f0a34a"/>
<text x="782" y="723" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f1320" text-anchor="middle">11</text>
<text x="24" y="775" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e3e7f2" text-anchor="start">Result: one 201 and one 422; total 6, one extension row, one probation.extended audit row (lifecycle.test.ts).</text>
<text x="24" y="794" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#98a1bb" text-anchor="start">B checks the limit against the committed total (6), not the total it would have seen without the lock (3).</text>
<text x="24" y="813" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#98a1bb" text-anchor="start">Without the lock both checks would pass; B’s UPDATE would then wait on A’s row and fail CHECK total ≤ 6 → 422 CONSTRAINT_VIOLATION.</text>
<rect x="24" y="844" width="14" height="14" rx="3" fill="#1c2547" stroke="#7c95f5" stroke-width="1.5"/>
<text x="44" y="855" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#98a1bb" text-anchor="start">request / control flow</text>
<rect x="192.2" y="844" width="14" height="14" rx="3" fill="#15301e" stroke="#5cc477" stroke-width="1.5"/>
<text x="212.2" y="855" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#98a1bb" text-anchor="start">success (2xx)</text>
<rect x="305.5" y="844" width="14" height="14" rx="3" fill="#36260f" stroke="#f0a34a" stroke-width="1.5"/>
<text x="325.5" y="855" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#98a1bb" text-anchor="start">rejected (4xx): nothing written</text>
<rect x="528.6" y="844" width="14" height="14" rx="3" fill="#261e45" stroke="#a58cff" stroke-width="1.5"/>
<text x="548.6" y="855" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#98a1bb" text-anchor="start">blocked on a row lock</text>
<rect x="690.7" y="844" width="14" height="14" rx="3" fill="#0f2e33" stroke="#4fc1d1" stroke-width="1.5"/>
<text x="710.7" y="855" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#98a1bb" text-anchor="start">PostgreSQL</text>
<rect x="785.7" y="844" width="14" height="14" rx="3" fill="none" stroke="#98a1bb" stroke-width="1.5"/>
<text x="805.7" y="855" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#98a1bb" text-anchor="start">dashed arrow: reply</text>
