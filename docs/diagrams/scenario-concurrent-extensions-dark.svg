<circle cx="322" cy="510" r="9" fill="#4fc1d1"/>
<text x="322" y="514" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f1320" text-anchor="middle">7</text>
<path d="M 335 547 L 117 547" fill="none" stroke="#5cc477" stroke-width="1.6" marker-end="url(#arrow-success)"/>
<text x="225" y="539" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#5cc477" text-anchor="middle">201 · total 6</text>
<circle cx="358" cy="547" r="9" fill="#5cc477"/>
<text x="358" y="551" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f1320" text-anchor="middle">8</text>
