<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 442" width="700" height="442" role="img" aria-labelledby="title desc">
<title id="title">Add employee</title>
<desc id="desc">The client posts the new employee. The API validates the input, then in one transaction inserts the employee and an "employee created" audit event, commits, and returns 201 Created.</desc>
<defs><marker id="head-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/></marker><marker id="head-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="head-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#3b5bdb"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#66708a"/></marker></defs>
<rect width="700" height="442" fill="#ffffff"/>
<rect x="35" y="30" width="170" height="44" rx="6" fill="#ffffff" stroke="#7d88a6" stroke-width="1.5"/>
<text x="120" y="56" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2633" text-anchor="middle">Client</text>
<line x1="120" y1="74" x2="120" y2="422" stroke="#7d88a6" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="265" y="30" width="170" height="44" rx="6" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="350" y="56" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2633" text-anchor="middle">API</text>
<line x1="350" y1="74" x2="350" y2="422" stroke="#7d88a6" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="495" y="30" width="170" height="44" rx="6" fill="#e7f6f8" stroke="#0b7285" stroke-width="1.5"/>
<text x="580" y="56" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2633" text-anchor="middle">Database</text>
