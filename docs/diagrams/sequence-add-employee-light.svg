<path d="M 120 110 L 348 110" fill="none" stroke="#3b5bdb" stroke-width="1.5" marker-end="url(#head-main)"/>
<text x="235" y="102" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2633" text-anchor="middle">POST /employees</text>
<path d="M 350 150 L 390 150 L 390 174 L 352 174" fill="none" stroke="#3b5bdb" stroke-width="1.5" marker-end="url(#head-main)"/>
<text x="398" y="166" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2633" text-anchor="start">validate input</text>
<path d="M 350 212 L 578 212" fill="none" stroke="#3b5bdb" stroke-width="1.5" marker-end="url(#head-main)"/>
