<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 184" width="1030" height="184" role="img" aria-labelledby="title desc">
<title id="title">How the list is grouped</title>
<desc id="desc">Each unconfirmed probation is placed by its days until end (end date minus today): below 0 is Overdue, 0 to 7 is Due in 7 days, 8 to 30 is Due in 30 days, and 31 up to N is Due later. Day 0, a probation that ends today, is due, not overdue.</desc>
<defs><marker id="head-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#57c26f"/></marker><marker id="head-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#f07070"/></marker><marker id="head-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#7c95f5"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#8b95ad"/></marker></defs>
<rect width="1030" height="184" fill="#0d1117"/>
<rect x="43" y="30" width="204" height="50" rx="4" fill="#1a2240" stroke="#7c95f5" stroke-width="1.5"/>
<text x="145" y="52" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">Overdue</text>
<text x="145" y="70" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b95ad" text-anchor="middle">before today</text>
<rect x="253" y="30" width="154" height="50" rx="4" fill="#1a2240" stroke="#7c95f5" stroke-width="1.5"/>
<text x="330" y="52" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">Due in 7 days</text>
<text x="330" y="70" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b95ad" text-anchor="middle">day 0–7</text>
<rect x="413" y="30" width="454" height="50" rx="4" fill="#1a2240" stroke="#7c95f5" stroke-width="1.5"/>
<text x="640" y="52" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">Due in 30 days</text>
<text x="640" y="70" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b95ad" text-anchor="middle">day 8–30</text>
<rect x="873" y="30" width="104" height="50" rx="4" fill="#161b26" stroke="#5d6782" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="925" y="52" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">Due later</text>
<text x="925" y="70" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b95ad" text-anchor="middle">day 31–N</text>
<path d="M 40 120 L 990 120" fill="none" stroke="#8b95ad" stroke-width="1.5" marker-end="url(#head-muted)"/>
<line x1="240" y1="114" x2="240" y2="126" stroke="#e6edf3" stroke-width="1.5"/>
<text x="240" y="142" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">-1</text>
<line x1="260" y1="114" x2="260" y2="126" stroke="#e6edf3" stroke-width="1.5"/>
<text x="260" y="142" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">0</text>
<line x1="400" y1="114" x2="400" y2="126" stroke="#e6edf3" stroke-width="1.5"/>
<text x="400" y="142" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">7</text>
<line x1="420" y1="114" x2="420" y2="126" stroke="#e6edf3" stroke-width="1.5"/>
<text x="420" y="142" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">8</text>
<line x1="860" y1="114" x2="860" y2="126" stroke="#e6edf3" stroke-width="1.5"/>
<text x="860" y="142" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">30</text>
<line x1="880" y1="114" x2="880" y2="126" stroke="#e6edf3" stroke-width="1.5"/>
<text x="880" y="142" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">31</text>
<line x1="260" y1="110" x2="260" y2="130" stroke="#57c26f" stroke-width="3"/>
<text x="260" y="162" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#57c26f" text-anchor="middle">today: ends today is due, not overdue</text>
<text x="990" y="142" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b95ad" text-anchor="end">days until end</text>
</svg>
