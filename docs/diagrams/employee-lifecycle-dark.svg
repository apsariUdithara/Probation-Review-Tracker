<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 200" width="790" height="200" role="img" aria-labelledby="title desc">
<title id="title">Employee lifecycle</title>
<desc id="desc">State diagram. Adding an employee starts them in On probation. Extending keeps them On probation as long as the total stays at or below 6 months. Confirming moves them to Confirmed; nothing moves them out of it.</desc>
<defs><marker id="head-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#57c26f"/></marker><marker id="head-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#f07070"/></marker><marker id="head-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#7c95f5"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#8b95ad"/></marker></defs>
<rect width="790" height="200" fill="#0d1117"/>
<circle cx="50" cy="130" r="9" fill="#e6edf3"/>
<path d="M 60 130 L 178 130" fill="none" stroke="#8b95ad" stroke-width="1.5" marker-end="url(#head-muted)"/>
<rect x="72.2" y="100" width="93.6" height="20" fill="#0d1117"/>
<text x="119" y="114" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">add employee</text>
<rect x="180" y="96" width="190" height="68" rx="22" fill="#1a2240" stroke="#7c95f5" stroke-width="1.5"/>
<text x="275" y="135" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">On probation</text>
<rect x="560" y="96" width="190" height="68" rx="22" fill="#1a2240" stroke="#7c95f5" stroke-width="1.5"/>
<text x="655" y="135" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Confirmed</text>
<path d="M 370 130 L 558 130" fill="none" stroke="#8b95ad" stroke-width="1.5" marker-end="url(#head-muted)"/>
<rect x="434.2" y="100" width="59.6" height="20" fill="#0d1117"/>
<text x="464" y="114" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">confirm</text>
<path d="M 240 96 C 240 30, 310 30, 310 94" fill="none" stroke="#8b95ad" stroke-width="1.5" marker-end="url(#head-muted)"/>
<text x="275" y="32" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">extend [total ≤ 6 months]</text>
</svg>
