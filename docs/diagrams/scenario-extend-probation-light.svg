<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 915" width="1100" height="915" role="img" aria-labelledby="title desc">
<title id="title">Scenario: extend a probation</title>
<desc id="desc">Sequence diagram for extending a probation by 2 months. The route validates the id and body, then calls extendProbation. The service begins a transaction and locks the employee row; Postgres returns status on_probation, total 3, end 2026-04-15. assertCanExtend(3, 2) passes because 5 is at most 6. The service adds 2 months to the total; Postgres recomputes the end date from the join date as 2026-06-15. It inserts the extension row with previous and new end dates, inserts a probation.extended audit event and commits. The client receives 201 with the employee and the extension.</desc>
