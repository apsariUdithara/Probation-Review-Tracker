<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 592" width="760" height="592" role="img" aria-labelledby="title desc">
<title id="title">Two confirms at the same time</title>
<desc id="desc">Two requests try to confirm the same employee. Request A takes the row lock with SELECT … FOR UPDATE; request B blocks on the same lock. A confirms, writes the audit event and commits, which releases the lock, and returns 200. B then re-reads the row, sees it is already confirmed, rolls back and returns 409. Exactly one audit event is written.</desc>
<defs><marker id="head-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/></marker><marker id="head-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="head-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#3b5bdb"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#66708a"/></marker></defs>
<rect width="760" height="592" fill="#ffffff"/>
<rect x="40" y="30" width="180" height="44" rx="6" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="130" y="56" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2633" text-anchor="middle">Request A</text>
<line x1="130" y1="74" x2="130" y2="572" stroke="#7d88a6" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="290" y="30" width="180" height="44" rx="6" fill="#e7f6f8" stroke="#0b7285" stroke-width="1.5"/>
<text x="380" y="56" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2633" text-anchor="middle">PostgreSQL</text>
<line x1="380" y1="74" x2="380" y2="572" stroke="#7d88a6" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="540" y="30" width="180" height="44" rx="6" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="630" y="56" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2633" text-anchor="middle">Request B</text>
<line x1="630" y1="74" x2="630" y2="572" stroke="#7d88a6" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="624" y="194" width="12" height="244" fill="#ffffff" stroke="#66708a" stroke-dasharray="3 3"/>
<path d="M 130 110 L 378 110" fill="none" stroke="#3b5bdb" stroke-width="1.5" marker-end="url(#head-main)"/>
<text x="255" y="102" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2633" text-anchor="middle">BEGIN · SELECT … FOR UPDATE</text>
<path d="M 380 150 L 132 150" fill="none" stroke="#66708a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#head-muted)"/>
<text x="255" y="142" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2633" text-anchor="middle">row (on_probation)</text>
<path d="M 630 190 L 382 190" fill="none" stroke="#3b5bdb" stroke-width="1.5" marker-end="url(#head-main)"/>
<text x="505" y="182" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2633" text-anchor="middle">BEGIN · SELECT … FOR UPDATE</text>
<rect x="555" y="226" width="150" height="28" rx="4" fill="#ffffff" stroke="#66708a" stroke-width="1.5"/>
<text x="630" y="245" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#66708a" text-anchor="middle">waits for the lock</text>
<path d="M 130 274 L 378 274" fill="none" stroke="#3b5bdb" stroke-width="1.5" marker-end="url(#head-main)"/>
<text x="255" y="266" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2633" text-anchor="middle">UPDATE status = confirmed</text>
<path d="M 130 314 L 378 314" fill="none" stroke="#3b5bdb" stroke-width="1.5" marker-end="url(#head-main)"/>
<text x="255" y="306" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2633" text-anchor="middle">INSERT audit event</text>
<path d="M 130 354 L 378 354" fill="none" stroke="#3b5bdb" stroke-width="1.5" marker-end="url(#head-main)"/>
<text x="255" y="346" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2633" text-anchor="middle">COMMIT (releases lock)</text>
<rect x="97" y="390" width="66" height="28" rx="4" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="130" y="409" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2b8a3e" text-anchor="middle">200 OK</text>
<path d="M 380 438 L 628 438" fill="none" stroke="#66708a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#head-muted)"/>
<text x="505" y="430" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2633" text-anchor="middle">re-read: confirmed</text>
<path d="M 630 478 L 382 478" fill="none" stroke="#3b5bdb" stroke-width="1.5" marker-end="url(#head-main)"/>
<text x="505" y="470" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2633" text-anchor="middle">ROLLBACK</text>
<rect x="544.5" y="514" width="171" height="28" rx="4" fill="#ffffff" stroke="#c92a2a" stroke-width="1.5"/>
<text x="630" y="533" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c92a2a" text-anchor="middle">409 ALREADY_CONFIRMED</text>
</svg>
