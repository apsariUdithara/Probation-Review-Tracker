<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" width="1100" height="690" role="img" aria-labelledby="title desc">
<title id="title">Scenario: how the end date is calculated</title>
<desc id="desc">probation_end_date is a Postgres generated column: join_date plus total_probation_months months, recomputed on insert and on every update of the total. Examples: 2024-02-29 plus 3 months is 2024-05-29 and plus 6 is 2024-08-29; 2026-01-15 plus 3 is 2026-04-15; 2025-08-31 plus 6 is clamped to 2026-02-28; 2023-08-31 plus 6 is clamped to 2024-02-29. Extensions do not chain: joining 2025-11-30 on 3 months and extending by 1 gives 2026-03-30 (join date plus 4 months), not 2026-03-28 (the old clamped end date plus 1 month).</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#e3e7f2"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#98a1bb"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#38405a"/></marker><marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#7c95f5"/></marker><marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5cc477"/></marker><marker id="arrow-rejected" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#f0a34a"/></marker><marker id="arrow-fault" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#f27474"/></marker><marker id="arrow-waiting" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#a58cff"/></marker><marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#4fc1d1"/></marker></defs>
<rect width="1100" height="690" rx="12" fill="#0f1320"/>
<text x="24" y="36" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e3e7f2" text-anchor="start">Scenario: how the end date is calculated</text>
<text x="24" y="58" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#98a1bb" text-anchor="start">Postgres computes it; JavaScript never does month arithmetic. Examples are the ones asserted in schema.test.ts and dates.test.ts.</text>
<rect x="24" y="80" width="1052" height="64" rx="8" fill="#0f2e33" stroke="#4fc1d1" stroke-width="1.5"/>
<text x="40" y="104" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#e3e7f2" text-anchor="start">probation_end_date date GENERATED ALWAYS AS ((join_date + make_interval(months =&gt; total_probation_months))::date) STORED</text>
<text x="40" y="128" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#98a1bb" text-anchor="start">Recomputed on every INSERT and on every UPDATE of total_probation_months. If the day does not exist in the target month, Postgres uses that month’s last day.</text>
<text x="40" y="176" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#98a1bb" text-anchor="start">join_date</text>
<text x="232" y="176" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#98a1bb" text-anchor="start">probation_end_date</text>
<text x="400" y="176" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#98a1bb" text-anchor="start">why</text>
<rect x="24" y="190" width="112" height="30" rx="15" fill="#0f2e33" stroke="#4fc1d1" stroke-width="1.5"/>
<text x="80" y="210" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#e3e7f2" text-anchor="middle">2024-02-29</text>
<path d="M 136 205 L 230 205" fill="none" stroke="#7c95f5" stroke-width="1.6" marker-end="url(#arrow-flow)"/>
<text x="183" y="199" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#7c95f5" text-anchor="middle">+3 months</text>
<rect x="232" y="190" width="112" height="30" rx="15" fill="#0f2e33" stroke="#4fc1d1" stroke-width="1.5"/>
<text x="288" y="210" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#e3e7f2" text-anchor="middle">2024-05-29</text>
<text x="400" y="210" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#98a1bb" text-anchor="start">29 February join (required case): May has a 29th, so no clamping; joinDate round-trips as "2024-02-29".</text>
<rect x="24" y="234" width="112" height="30" rx="15" fill="#0f2e33" stroke="#4fc1d1" stroke-width="1.5"/>
<text x="80" y="254" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#e3e7f2" text-anchor="middle">2024-02-29</text>
<path d="M 136 249 L 230 249" fill="none" stroke="#7c95f5" stroke-width="1.6" marker-end="url(#arrow-flow)"/>
<text x="183" y="243" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#7c95f5" text-anchor="middle">+6 months</text>
<rect x="232" y="234" width="112" height="30" rx="15" fill="#0f2e33" stroke="#4fc1d1" stroke-width="1.5"/>
<text x="288" y="254" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#e3e7f2" text-anchor="middle">2024-08-29</text>
<text x="400" y="254" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#98a1bb" text-anchor="start">Same day of the month, six months on.</text>
<rect x="24" y="278" width="112" height="30" rx="15" fill="#0f2e33" stroke="#4fc1d1" stroke-width="1.5"/>
<text x="80" y="298" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#e3e7f2" text-anchor="middle">2026-01-15</text>
<path d="M 136 293 L 230 293" fill="none" stroke="#7c95f5" stroke-width="1.6" marker-end="url(#arrow-flow)"/>
<text x="183" y="287" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#7c95f5" text-anchor="middle">+3 months</text>
<rect x="232" y="278" width="112" height="30" rx="15" fill="#0f2e33" stroke="#4fc1d1" stroke-width="1.5"/>
<text x="288" y="298" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#e3e7f2" text-anchor="middle">2026-04-15</text>
<text x="400" y="298" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#98a1bb" text-anchor="start">The anniversary date (assumption A2).</text>
<rect x="24" y="322" width="112" height="30" rx="15" fill="#0f2e33" stroke="#4fc1d1" stroke-width="1.5"/>
<text x="80" y="342" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#e3e7f2" text-anchor="middle">2025-08-31</text>
<path d="M 136 337 L 230 337" fill="none" stroke="#7c95f5" stroke-width="1.6" marker-end="url(#arrow-flow)"/>
<text x="183" y="331" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#7c95f5" text-anchor="middle">+6 months</text>
<rect x="232" y="322" width="112" height="30" rx="15" fill="#0f2e33" stroke="#4fc1d1" stroke-width="1.5"/>
<text x="288" y="342" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#e3e7f2" text-anchor="middle">2026-02-28</text>
<text x="352" y="342" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7c95f5" text-anchor="start">clamped</text>
<text x="400" y="342" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e3e7f2" text-anchor="start">Clamped: February 2026 has no 29th, 30th or 31st.</text>
<rect x="24" y="366" width="112" height="30" rx="15" fill="#0f2e33" stroke="#4fc1d1" stroke-width="1.5"/>
<text x="80" y="386" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#e3e7f2" text-anchor="middle">2023-08-31</text>
<path d="M 136 381 L 230 381" fill="none" stroke="#7c95f5" stroke-width="1.6" marker-end="url(#arrow-flow)"/>
<text x="183" y="375" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#7c95f5" text-anchor="middle">+6 months</text>
<rect x="232" y="366" width="112" height="30" rx="15" fill="#0f2e33" stroke="#4fc1d1" stroke-width="1.5"/>
<text x="288" y="386" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#e3e7f2" text-anchor="middle">2024-02-29</text>
<text x="352" y="386" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7c95f5" text-anchor="start">clamped</text>
<text x="400" y="386" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e3e7f2" text-anchor="start">Clamped to the leap day: 2024 is a leap year.</text>
<text x="24" y="440" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e3e7f2" text-anchor="start">Extensions never chain from the old end date</text>
<text x="24" y="460" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#98a1bb" text-anchor="start">Joined 2025-11-30 on 3 months (ends 2026-02-28, clamped), then extended by 1. The total becomes 4.</text>
<rect x="24" y="514" width="112" height="30" rx="15" fill="#0f2e33" stroke="#4fc1d1" stroke-width="1.5"/>
<text x="80" y="534" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#e3e7f2" text-anchor="middle">2025-11-30</text>
<path d="M 136 529 L 170 529 L 170 499 L 548 499" fill="none" stroke="#7c95f5" stroke-width="1.6" marker-end="url(#arrow-flow)"/>
<text x="190" y="492" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#7c95f5" text-anchor="start">join_date + 4 months (what the generated column does)</text>
<rect x="550" y="484" width="112" height="30" rx="15" fill="#15301e" stroke="#5cc477" stroke-width="1.5"/>
<text x="606" y="504" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#e3e7f2" text-anchor="middle">2026-03-30</text>
<text x="674" y="504" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5cc477" text-anchor="start">✓ correct: the 30th is kept</text>
<path d="M 136 529 L 170 529 L 170 559 L 298 559" fill="none" stroke="#98a1bb" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
<text x="180" y="582" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#98a1bb" text-anchor="start">+3 months</text>
<rect x="300" y="544" width="112" height="30" rx="15" fill="#0f2e33" stroke="#4fc1d1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="356" y="564" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#e3e7f2" text-anchor="middle">2026-02-28</text>
<path d="M 412 559 L 548 559" fill="none" stroke="#98a1bb" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
<text x="480" y="582" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#98a1bb" text-anchor="middle">+1 month</text>
<rect x="550" y="544" width="112" height="30" rx="15" fill="#3a1a1d" stroke="#f27474" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="606" y="564" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#e3e7f2" text-anchor="middle">2026-03-28</text>
<text x="674" y="564" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#f27474" text-anchor="start">✗ chained: the clamp to the 28th is carried forward (not used)</text>
<text x="24" y="620" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#98a1bb" text-anchor="start">Dates stay strings in Node: src/db.ts overrides pg’s DATE parser, so "2024-02-29" is never turned into a local-midnight JS Date,</text>
<text x="24" y="638" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#98a1bb" text-anchor="start">which would serialise as 2024-02-28 in UTC for Asia/Colombo (UTC+05:30).</text>
<rect x="24" y="658" width="14" height="14" rx="3" fill="#1c2547" stroke="#7c95f5" stroke-width="1.5"/>
<text x="44" y="669" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#98a1bb" text-anchor="start">request / control flow</text>
<rect x="192.2" y="658" width="14" height="14" rx="3" fill="#15301e" stroke="#5cc477" stroke-width="1.5"/>
<text x="212.2" y="669" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#98a1bb" text-anchor="start">success (2xx)</text>
<rect x="305.5" y="658" width="14" height="14" rx="3" fill="#3a1a1d" stroke="#f27474" stroke-width="1.5"/>
<text x="325.5" y="669" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#98a1bb" text-anchor="start">server error (5xx)</text>
<rect x="449.3" y="658" width="14" height="14" rx="3" fill="#0f2e33" stroke="#4fc1d1" stroke-width="1.5"/>
<text x="469.3" y="669" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#98a1bb" text-anchor="start">PostgreSQL</text>
<rect x="544.3" y="658" width="14" height="14" rx="3" fill="none" stroke="#98a1bb" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="564.3" y="669" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#98a1bb" text-anchor="start">dashed: the chained calculation, not used</text>
</svg>
