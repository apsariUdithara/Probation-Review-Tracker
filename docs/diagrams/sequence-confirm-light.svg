<path d="M 380 522 L 628 522" fill="none" stroke="#3b5bdb" stroke-width="1.5" marker-end="url(#head-main)"/>
<text x="505" y="514" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2633" text-anchor="middle">ROLLBACK</text>
