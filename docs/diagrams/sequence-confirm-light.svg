<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 636" width="760" height="636" role="img" aria-labelledby="title desc">
<title id="title">Confirm employee</title>
<desc id="desc">The API begins a transaction and locks the employee row with lockEmployee (SELECT … FOR UPDATE). If the employee is on probation it runs markConfirmed, writes a probation.confirmed audit event, commits and returns 200. If already confirmed it rolls back with 409; if not found in this company it rolls back with 404.</desc>
