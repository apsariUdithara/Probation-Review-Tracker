<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="950" height="320" role="img" aria-labelledby="title desc">
<title id="title">Company isolation</title>
<desc id="desc">A request carries the caller company id in the X-Company-Id header. The API adds WHERE company_id = A to every query, so only Company A employees are returned; asking for a Company B employee gives 404, as if it did not exist. In the database, the composite foreign key (company_id, employee_id) blocks extension or audit rows that point at another company’s employee.</desc>
<defs><marker id="head-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/></marker><marker id="head-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="head-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#3b5bdb"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#66708a"/></marker></defs>
<rect width="950" height="320" fill="#ffffff"/>
<rect x="30" y="110" width="190" height="70" rx="6" fill="#ffffff" stroke="#7d88a6" stroke-width="1.5"/>
<text x="125" y="140.5" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2633" text-anchor="middle">Request</text>
<text x="125" y="159.5" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#66708a" text-anchor="middle">X-Company-Id: A</text>
<rect x="300" y="110" width="220" height="70" rx="6" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="410" y="140.5" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2633" text-anchor="middle">Probation API</text>
<text x="410" y="159.5" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#66708a" text-anchor="middle">WHERE company_id = A</text>
<rect x="600" y="30" width="320" height="270" rx="8" fill="#e7f6f8" stroke="#0b7285" stroke-width="1.5"/>
<text x="760" y="56" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2633" text-anchor="middle">Database</text>
<rect x="620" y="74" width="280" height="72" rx="6" fill="#ffffff" stroke="#7d88a6" stroke-width="1.5"/>
<text x="760" y="104" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2633" text-anchor="middle">Company A employees</text>
<text x="760" y="124" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2b8a3e" text-anchor="middle">returned</text>
<rect x="620" y="164" width="280" height="72" rx="6" fill="#ffffff" stroke="#7d88a6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="760" y="194" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#66708a" text-anchor="middle">Company B employees</text>
<text x="760" y="214" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c92a2a" text-anchor="middle">404, as if they did not exist</text>
<text x="760" y="272" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2633" text-anchor="middle">FK (company_id, employee_id)</text>
<text x="760" y="289" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#66708a" text-anchor="middle">blocks cross-company rows</text>
<path d="M 220 145 L 298 145" fill="none" stroke="#66708a" stroke-width="1.5" marker-end="url(#head-muted)"/>
<path d="M 520 135 L 618 110" fill="none" stroke="#2b8a3e" stroke-width="1.5" marker-end="url(#head-ok)"/>
</svg>
