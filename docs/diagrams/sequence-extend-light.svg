<path d="M 380 506 L 132 506" fill="none" stroke="#c92a2a" stroke-width="1.5" marker-end="url(#head-err)"/>
<text x="255" y="498" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c92a2a" text-anchor="middle">422 MAX_PROBATION_EXCEEDED</text>
<path d="M 380 562 L 628 562" fill="none" stroke="#3b5bdb" stroke-width="1.5" marker-end="url(#head-main)"/>
<text x="505" y="554" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2633" text-anchor="middle">ROLLBACK</text>
