<text x="130" y="56" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2633" text-anchor="middle">Client</text>
<line x1="130" y1="74" x2="130" y2="656" stroke="#7d88a6" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="290" y="30" width="180" height="44" rx="6" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="380" y="56" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2633" text-anchor="middle">API</text>
<line x1="380" y1="74" x2="380" y2="656" stroke="#7d88a6" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="540" y="30" width="180" height="44" rx="6" fill="#e7f6f8" stroke="#0b7285" stroke-width="1.5"/>
<text x="630" y="56" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2633" text-anchor="middle">PostgreSQL</text>
<line x1="630" y1="74" x2="630" y2="656" stroke="#7d88a6" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="20" y="224" width="720" height="396" fill="none" stroke="#7d88a6"/>
<text x="30" y="239" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2633" text-anchor="start">alt</text>
<path d="M 20 244 L 54 244 L 62 236 L 62 224" fill="none" stroke="#7d88a6"/>
<rect x="68" y="226" width="259.6" height="18" fill="#ffffff"/>
<text x="72" y="239" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#66708a" text-anchor="start">[on_probation and total + months ≤ 6]</text>
