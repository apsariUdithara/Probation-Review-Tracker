<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 490" width="1140" height="490" role="img" aria-labelledby="title desc">
<title id="title">Data model</title>
<desc id="desc">Entity-relationship diagram. A company has many employees; an employee has many probation extensions and many audit events. employees has CHECK 1 to 6 on total_probation_months, a generated probation_end_date, a status CHECK, and UNIQUE (company_id, id). probation_extensions and audit_events reference employees through the composite foreign key (company_id, employee_id), so they always belong to the same company as their employee. Extension months have CHECK 1 to 3.</desc>
