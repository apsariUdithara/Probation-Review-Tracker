<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 546" width="720" height="546" role="img" aria-labelledby="title desc">
<title id="title">API layers</title>
<desc id="desc">Requests pass down through four layers: middleware (tenant.ts) reads the company and user from headers, routes (routes.ts) validate input with Zod, the service (service.ts) applies rules inside transactions and writes the audit trail, and the repository (repository.ts) runs SQL scoped by company_id. The service uses pure rules in domain/probation.ts. Any error goes to error-handler.ts, which returns JSON.</desc>
