<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 214" width="800" height="214" role="img" aria-labelledby="title desc">
<title id="title">Employee lifecycle</title>
<desc id="desc">State diagram. Adding an employee starts them in On probation. Extending keeps them On probation while the total stays at or below 6 months; an extension over 6 is rejected with 422. Confirming moves them to Confirmed; confirming or extending a confirmed employee is rejected with 409.</desc>
<defs><marker id="head-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/></marker><marker id="head-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="head-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#3b5bdb"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#66708a"/></marker></defs>
<rect width="800" height="214" fill="#ffffff"/>
<circle cx="50" cy="130" r="9" fill="#1f2633"/>
<path d="M 60 130 L 178 130" fill="none" stroke="#66708a" stroke-width="1.5" marker-end="url(#head-muted)"/>
<rect x="73.4" y="100" width="91.2" height="20" fill="#ffffff"/>
<text x="119" y="114" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2633" text-anchor="middle">add employee</text>
<rect x="180" y="96" width="190" height="68" rx="22" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="275" y="135" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2633" text-anchor="middle">On probation</text>
<rect x="560" y="96" width="190" height="68" rx="22" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="655" y="135" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2633" text-anchor="middle">Confirmed</text>
<path d="M 370 130 L 558 130" fill="none" stroke="#66708a" stroke-width="1.5" marker-end="url(#head-muted)"/>
<rect x="434.9" y="100" width="58.2" height="20" fill="#ffffff"/>
<text x="464" y="114" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2633" text-anchor="middle">confirm</text>
<path d="M 240 96 C 240 30, 310 30, 310 94" fill="none" stroke="#66708a" stroke-width="1.5" marker-end="url(#head-muted)"/>
<text x="275" y="32" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2633" text-anchor="middle">extend [total ≤ 6 months]</text>
<text x="275" y="190" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c92a2a" text-anchor="middle">extend over 6 → 422</text>
<text x="655" y="190" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c92a2a" text-anchor="middle">confirm / extend → 409</text>
</svg>
