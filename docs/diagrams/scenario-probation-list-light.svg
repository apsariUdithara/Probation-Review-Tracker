<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 646" width="1140" height="646" role="img" aria-labelledby="title desc">
<title id="title">Scenario: build the grouped list</title>
<desc id="desc">Four steps: 1 the withinDays query is validated (0 to 365, default 30); 2 today is taken from the clock in Asia/Colombo; 3 one SELECT returns unconfirmed probations of this company ending on or before today plus N, with daysUntilEnd = end date minus today, sorted by end date, name and id; 4 bucketFor puts each row in a group: below 0 overdue, 0 to 7 due within 7 days, 8 to 30 due within 30 days, 31 to N due later. A probation ending today has daysUntilEnd 0 and is due within 7 days, not overdue. With N = 30 a probation 31 days away is not listed.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2235"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6480"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#c5cbdc"/></marker><marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#3b5bdb"/></marker><marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/></marker><marker id="arrow-rejected" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#b35c00"/></marker><marker id="arrow-fault" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="arrow-waiting" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#7048e8"/></marker><marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7285"/></marker></defs>
<rect width="1140" height="646" rx="12" fill="#f6f7fb"/>
<text x="24" y="36" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1b2235" text-anchor="start">Scenario: build the grouped list</text>
<text x="24" y="58" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6480" text-anchor="start">GET /probations?withinDays=N → listProbations(). A read: one SELECT on the pool, no transaction. Example: test clock today = 2026-11-13, N = 30.</text>
<rect x="24" y="86" width="232" height="132" rx="8" fill="#e9edfc" stroke="#3b5bdb" stroke-width="1.5"/>
<circle cx="42" cy="106" r="9" fill="#3b5bdb"/>
<text x="42" y="110" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#f6f7fb" text-anchor="middle">1</text>
<text x="58" y="111" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#1b2235" text-anchor="start">listProbationsQuery</text>
<text x="38" y="136" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6480" text-anchor="start">withinDays: digits only, 0–365</text>
<text x="38" y="152" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6480" text-anchor="start">missing → 30</text>
<text x="38" y="168" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6480" text-anchor="start">'', -1, 366, 1.5 → 400</text>
<path d="M 256 152 L 274 152" fill="none" stroke="#3b5bdb" stroke-width="1.6" marker-end="url(#arrow-flow)"/>
<rect x="276" y="86" width="232" height="132" rx="8" fill="#e9edfc" stroke="#3b5bdb" stroke-width="1.5"/>
<circle cx="294" cy="106" r="9" fill="#3b5bdb"/>
<text x="294" y="110" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#f6f7fb" text-anchor="middle">2</text>
<text x="310" y="111" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#1b2235" text-anchor="start">clock.today()</text>
<text x="290" y="136" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6480" text-anchor="start">todayIn('Asia/Colombo') via</text>
<text x="290" y="152" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6480" text-anchor="start">Intl formatToParts</text>
<text x="290" y="168" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6480" text-anchor="start">→ '2026-11-13' (fixed in tests)</text>
<path d="M 508 152 L 526 152" fill="none" stroke="#3b5bdb" stroke-width="1.6" marker-end="url(#arrow-flow)"/>
<rect x="528" y="86" width="372" height="132" rx="8" fill="#e3f4f6" stroke="#0b7285" stroke-width="1.5"/>
<circle cx="546" cy="106" r="9" fill="#0b7285"/>
<text x="546" y="110" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#f6f7fb" text-anchor="middle">3</text>
<text x="562" y="111" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#1b2235" text-anchor="start">listOpenProbations</text>
<text x="542" y="136" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#1b2235" text-anchor="start">WHERE company_id = $1</text>
<text x="542" y="152" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#1b2235" text-anchor="start">  AND status = 'on_probation'</text>
<text x="542" y="168" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#1b2235" text-anchor="start">  AND probation_end_date &lt;= $2::date + $3::int</text>
<text x="542" y="184" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#1b2235" text-anchor="start">ORDER BY probation_end_date, name, id</text>
<text x="542" y="200" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#1b2235" text-anchor="start">daysUntilEnd = probation_end_date - $2::date</text>
<path d="M 900 152 L 918 152" fill="none" stroke="#3b5bdb" stroke-width="1.6" marker-end="url(#arrow-flow)"/>
<rect x="920" y="86" width="196" height="132" rx="8" fill="#e9edfc" stroke="#3b5bdb" stroke-width="1.5"/>
<circle cx="938" cy="106" r="9" fill="#3b5bdb"/>
<text x="938" y="110" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#f6f7fb" text-anchor="middle">4</text>
<text x="954" y="111" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#1b2235" text-anchor="start">bucketFor()</text>
<text x="934" y="136" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6480" text-anchor="start">each row → one group</text>
<text x="934" y="152" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6480" text-anchor="start">SQL order is kept</text>
<text x="934" y="168" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6480" text-anchor="start">counts per group</text>
<circle cx="34" cy="262" r="9" fill="#3b5bdb"/>
<text x="34" y="266" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#f6f7fb" text-anchor="middle">4</text>
<text x="50" y="267" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2235" text-anchor="start">bucketFor(daysUntilEnd) on a day axis (N = 30)</text>
<text x="50" y="286" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6480" text-anchor="start">The SQL window is probation_end_date ≤ today + N with no lower bound, so overdue rows are always included.</text>
<rect x="80" y="346" width="230" height="28" rx="4" fill="#e9edfc" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="195" y="364" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="700" fill="#1b2235" text-anchor="middle">overdue</text>
<text x="195" y="422" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6480" text-anchor="middle">below 0, however old</text>
<rect x="310" y="346" width="160" height="28" rx="4" fill="#e9edfc" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="390" y="364" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="700" fill="#1b2235" text-anchor="middle">dueWithin7Days</text>
<text x="390" y="422" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6480" text-anchor="middle">0 to 7</text>
<rect x="470" y="346" width="460" height="28" rx="4" fill="#e9edfc" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="700" y="364" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="700" fill="#1b2235" text-anchor="middle">dueWithin30Days</text>
<text x="700" y="422" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6480" text-anchor="middle">8 to 30</text>
<rect x="930" y="346" width="150" height="28" rx="4" fill="none" stroke="#5b6480" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1005" y="364" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="700" fill="#5b6480" text-anchor="middle">not listed</text>
<text x="1005" y="422" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6480" text-anchor="middle">over N</text>
<path d="M 82 380 L 1080 380" fill="none" stroke="#1b2235" stroke-width="1.6" marker-end="url(#arrow-ink)"/>
<path d="M 94 374 L 82 380 L 94 386" fill="none" stroke="#1b2235" stroke-width="1.6"/>
<path d="M 300 376 L 300 384" fill="none" stroke="#1b2235" stroke-width="1.4"/>
<text x="300" y="400" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#1b2235" text-anchor="middle">-1</text>
<path d="M 320 376 L 320 384" fill="none" stroke="#1b2235" stroke-width="1.4"/>
<text x="320" y="400" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#1b2235" text-anchor="middle">0</text>
<path d="M 460 376 L 460 384" fill="none" stroke="#1b2235" stroke-width="1.4"/>
<text x="460" y="400" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#1b2235" text-anchor="middle">7</text>
<path d="M 480 376 L 480 384" fill="none" stroke="#1b2235" stroke-width="1.4"/>
<text x="480" y="400" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#1b2235" text-anchor="middle">8</text>
<path d="M 920 376 L 920 384" fill="none" stroke="#1b2235" stroke-width="1.4"/>
<text x="920" y="400" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#1b2235" text-anchor="middle">30</text>
<path d="M 940 376 L 940 384" fill="none" stroke="#1b2235" stroke-width="1.4"/>
<text x="940" y="400" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#1b2235" text-anchor="middle">31</text>
<text x="1076" y="338" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6480" text-anchor="end">daysUntilEnd →</text>
<path d="M 300 328 L 300 344" fill="none" stroke="#3b5bdb" stroke-width="1.2"/>
<circle cx="300" cy="380" r="5" fill="#3b5bdb"/>
<text x="300" y="305" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3b5bdb" text-anchor="middle">ended yesterday</text>
<text x="300" y="320" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6480" text-anchor="middle">joined 2026-08-12 → overdue</text>
<path d="M 320 280 L 320 344" fill="none" stroke="#2b8a3e" stroke-width="1.2"/>
<circle cx="320" cy="380" r="5" fill="#2b8a3e"/>
<text x="320" y="242" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2b8a3e" text-anchor="middle">ENDS TODAY (required case)</text>
<text x="320" y="257" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6480" text-anchor="middle">joined 2026-08-13 + 3 months</text>
<text x="320" y="272" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6480" text-anchor="middle">→ dueWithin7Days, not overdue</text>
<path d="M 920 328 L 920 344" fill="none" stroke="#3b5bdb" stroke-width="1.2"/>
<circle cx="920" cy="380" r="5" fill="#3b5bdb"/>
<text x="920" y="320" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3b5bdb" text-anchor="middle">day 30 → dueWithin30Days</text>
<path d="M 940 280 L 940 344" fill="none" stroke="#5b6480" stroke-width="1.2"/>
<circle cx="940" cy="380" r="5" fill="#5b6480"/>
<text x="940" y="257" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#5b6480" text-anchor="middle">day 31 → not listed</text>
<text x="940" y="272" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6480" text-anchor="middle">when N = 30</text>
<rect x="24" y="470" width="520" height="120" rx="8" fill="#ffffff" stroke="#5b6480" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="38" y="492" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1b2235" text-anchor="start">With N &gt; 30 a fourth group appears</text>
<text x="38" y="514" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6480" text-anchor="start">dueLater: 31 to N days (e.g. N = 60 → days 31–60).</text>
<text x="38" y="531" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6480" text-anchor="start">N = 0 → only overdue and ending today.</text>
<text x="38" y="548" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6480" text-anchor="start">Confirmed employees and other companies never</text>
<text x="38" y="565" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6480" text-anchor="start">reach bucketFor: the WHERE clause removes them.</text>
<rect x="564" y="470" width="552" height="120" rx="8" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="578" y="492" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2b8a3e" text-anchor="start">200 response (all four arrays always present)</text>
<text x="578" y="516" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#1b2235" text-anchor="start">{ "asOf": "2026-11-13", "withinDays": 30,</text>
<text x="578" y="533" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#1b2235" text-anchor="start">  "counts": { "overdue": 1, "dueWithin7Days": 1, … },</text>
<text x="578" y="550" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#1b2235" text-anchor="start">  "overdue": [ … ], "dueWithin7Days": [ { …, "daysUntilEnd": 0 } ],</text>
<text x="578" y="567" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#1b2235" text-anchor="start">  "dueWithin30Days": [ … ], "dueLater": [] }</text>
<rect x="24" y="614" width="14" height="14" rx="3" fill="#e9edfc" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="44" y="625" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6480" text-anchor="start">request / control flow</text>
<rect x="192.2" y="614" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="212.2" y="625" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6480" text-anchor="start">success (2xx)</text>
<rect x="305.5" y="614" width="14" height="14" rx="3" fill="#e3f4f6" stroke="#0b7285" stroke-width="1.5"/>
<text x="325.5" y="625" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6480" text-anchor="start">PostgreSQL</text>
<rect x="400.5" y="614" width="14" height="14" rx="3" fill="none" stroke="#5b6480" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="420.5" y="625" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6480" text-anchor="start">dashed: not returned / explanation</text>
</svg>
