<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 522" width="760" height="522" role="img" aria-labelledby="title desc">
<title id="title">Add employee</title>
<desc id="desc">The client posts the new employee. The API validates the input with Zod; invalid input returns 400 before anything is written. Valid input is saved in one transaction: insertEmployee (Postgres generates the end date), then an employee.created audit event, then COMMIT, and the API returns 201 Created with a Location header.</desc>
