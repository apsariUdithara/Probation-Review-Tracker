<text x="265" y="112.5" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#66708a" text-anchor="middle">React + Vite (optional)</text>
<rect x="170" y="170" width="190" height="76" rx="6" fill="#ffffff" stroke="#7d88a6" stroke-width="1.5"/>
